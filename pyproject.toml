[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "htcondor-noun-verb-demo"
dynamic = ["version"]
description = 'Demo of noun verb CLI proposal for HTCondor'
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = []
authors = [
  { name = "aowen-uwmad", email = "aowen4@wisc.edu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/aowen-uwmad/htcondor-noun-verb-demo#readme"
Issues = "https://github.com/aowen-uwmad/htcondor-noun-verb-demo/issues"
Source = "https://github.com/aowen-uwmad/htcondor-noun-verb-demo"

[tool.hatch.version]
path = "src/htcondor_noun_verb_demo/__about__.py"

[tool.hatch.envs.default]
python = "3.9"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/htcondor_noun_verb_demo tests}"

[tool.coverage.run]
source_pkgs = ["htcondor_noun_verb_demo", "tests"]
branch = true
parallel = true
omit = [
  "src/htcondor_noun_verb_demo/__about__.py",
]

[tool.coverage.paths]
htcondor_noun_verb_demo = ["src/htcondor_noun_verb_demo", "*/htcondor-noun-verb-demo/src/htcondor_noun_verb_demo"]
tests = ["tests", "*/htcondor-noun-verb-demo/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
